<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>选择游戏 · 红熊大侠 / OpenBear</title>
  <meta name="description" content="两款游戏：水墨古侠横版动作《红熊大侠》，与第一人称《胖虎制作 · OpenBear》。" />
  <link rel="icon" type="image/png" href="./redbear/favicon.png" />
  <link rel="apple-touch-icon" href="./redbear/app-icon.png" />
  <meta property="og:title" content="红熊大侠 / OpenBear" />
  <meta property="og:description" content="两款游戏，选一个开始。" />
  <meta property="og:image" content="./redbear/share-cover.jpg" />
  <style>
    /* 选游戏页：左半宣纸水墨（红熊大侠），右半 OpenBear 夜色（OpenBear），各沿用自家配色 */
    :root {
      --paper: #efe7d6; --ink: #1a1714; --red: #b3261e;
      --night: #0b0d0f; --bone: #e8e4da; --bone-dim: rgba(232, 228, 218, .64); --signal: #ffb347;
      --brush: "Kaiti SC", "STKaiti", "KaiTi", "楷体", serif;
      --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--night); font-family: var(--sans); -webkit-text-size-adjust: 100%; }
    main { display: grid; grid-template-columns: 1fr 1fr; min-height: 100%; min-height: 100dvh; }

    .game { position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; overflow: hidden;
      padding: 48px max(32px, env(safe-area-inset-left, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)); text-decoration: none; isolation: isolate; }
    .game .art { position: absolute; inset: 0; z-index: -1; transition: transform .8s cubic-bezier(.2, .7, .2, 1), opacity .4s ease; }
    .game:hover .art, .game:focus-visible .art { transform: scale(1.04); }
    .game:focus-visible { outline: 3px solid currentColor; outline-offset: -8px; }
    .name { margin: 0; line-height: 1; }
    .tag { margin: 0; max-width: 28em; line-height: 1.7; font-size: 15px; }
    .go { margin-top: 8px; display: inline-flex; align-items: center; gap: 10px; align-self: flex-start; font-size: 15px; letter-spacing: .2em; padding: 10px 18px; border: 1px solid currentColor; transition: background .2s, color .2s; }

    /* 红熊大侠 */
    .redbear { background: var(--paper); color: var(--ink); }
    .redbear .art { background: url("./redbear/share-cover.jpg") center / cover no-repeat; opacity: .9; }
    .redbear .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, var(--paper) 18%, rgba(239, 231, 214, .55) 50%, rgba(239, 231, 214, 0) 80%); }
    .redbear .name { font-family: var(--brush); font-weight: 400; font-size: clamp(56px, 8vw, 104px); }
    .redbear .sub { font-family: Georgia, serif; font-size: 13px; letter-spacing: .3em; opacity: .7; }
    .redbear .tag { font-family: var(--brush); font-size: 18px; }
    .redbear .go { font-family: var(--brush); font-size: 18px; }
    .redbear:hover .go, .redbear:focus-visible .go { background: var(--ink); color: var(--paper); }
    .seal { position: absolute; top: 40px; right: 40px; width: 64px; height: 64px; display: grid; place-items: center; background: var(--red); color: var(--paper);
      font-family: var(--brush); font-size: 24px; line-height: .95; text-align: center; transform: rotate(-4deg); }

    /* OpenBear */
    .openbear { background: var(--night); color: var(--bone); }
    .openbear .art { background:
      repeating-linear-gradient(90deg, rgba(232, 228, 218, .05) 0 1px, transparent 1px 64px),
      repeating-linear-gradient(0deg, rgba(232, 228, 218, .05) 0 1px, transparent 1px 64px),
      radial-gradient(120% 80% at 70% 20%, rgba(210, 98, 42, .35), transparent 60%),
      radial-gradient(90% 70% at 20% 90%, rgba(255, 179, 71, .14), transparent 60%),
      var(--night); }
    .openbear .name { font-weight: 900; font-size: clamp(44px, 6.4vw, 84px); letter-spacing: .14em; }
    .openbear .sub { font-size: 12px; letter-spacing: .3em; color: var(--signal); }
    .openbear .tag { color: var(--bone-dim); }
    .openbear .go { color: var(--signal); }
    .openbear:hover .go, .openbear:focus-visible .go { background: var(--signal); color: var(--night); }
    .stripe { position: absolute; top: 40px; right: 40px; width: 96px; height: 12px; background: repeating-linear-gradient(-45deg, var(--signal) 0 8px, transparent 8px 16px); opacity: .8; }

    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
      .game { padding: 28px 16px calc(28px + env(safe-area-inset-bottom, 0px)); gap: 10px; min-height: 50dvh; }
      .seal, .stripe { top: 20px; right: 16px; }
      .seal { width: 52px; height: 52px; font-size: 20px; }
      .tag { font-size: 14px; } .redbear .tag { font-size: 16px; }
    }
    @media (prefers-reduced-motion: reduce) { .game .art { transition: none; } .game:hover .art { transform: none; } }
  </style>
</head>
<body>
  <main>
    <a class="game redbear" href="./redbear/">
      <div class="art" aria-hidden="true"></div>
      <div class="seal" aria-hidden="true">红<br />熊</div>
      <span class="sub">RED BEAR · WAY OF THE XIA</span>
      <h1 class="name">红熊大侠</h1>
      <p class="tag">水墨剪影的古侠横版动作。红熊门下，竹林闯关。</p>
      <span class="go">入江湖 →</span>
    </a>
    <a class="game openbear" href="./openbear/">
      <div class="art" aria-hidden="true"></div>
      <div class="stripe" aria-hidden="true"></div>
      <span class="sub">OPENBEAR · 16F / 港区</span>
      <h2 class="name">胖虎制作</h2>
      <p class="tag">防御系统失控。切断三处中继，突破封锁，撤离。办公 16F / 港区两张地图。</p>
      <span class="go">进入行动 →</span>
    </a>
  </main>
</body>
</html>
